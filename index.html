<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#155e75"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Medikamente"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-180.png"><link rel="stylesheet" href="styles.css"><meta name="description" content="Offline-Medikamentenplan mit Bedarfseinnahmen"><title>Meine Medikamente</title></head><body><div class="app"><header><div><small>MEIN GESUNDHEITSPLAN</small><h1>Meine Medikamente</h1></div><span id="offline" class="pill">Lokal gespeichert</span></header><nav aria-label="Navigation"><button data-view="today" class="active">Heute</button><button data-view="meds">Medikamente</button><button data-view="history">Verlauf</button><button data-view="appointments">Termine</button><button data-view="doctors">Ärzte</button><button data-view="settings">Daten</button></nav><main id="main"></main><footer>Deine Daten bleiben auf diesem Gerät. Diese App ersetzt keine medizinische Beratung.</footer></div><dialog id="editor"><form id="med-form"><h2 id="editor-title">Medikament</h2><input type="hidden" name="id"><label>Name<input name="name" required maxlength="100" placeholder="z. B. Medikament A"></label><label>Dosierung<input name="dose" required maxlength="100" placeholder="z. B. 1 Tablette / 5 mg"></label><label id="time-label">Einnahmezeit <span id="time-optional" class="muted"></span><input type="time" name="time" required value="08:00"></label><label id="intakes-label">Wie oft pro geplantem Tag?<input name="intakesPerDay" id="intakesPerDay" type="number" min="1" max="24" step="1" inputmode="numeric" value="1" required><span class="muted">Zahl von 1 bis 24 eingeben. Für jede Einnahme wird eine eigene Uhrzeit angezeigt.</span></label><div id="extra-times" class="schedule-options"></div><label>Darreichungsform (optional)<select name="form"><option value="">Keine Angabe</option><option>Tablette</option><option>Kapsel</option><option>Pen</option><option>Spritze</option><option>Tropfen</option><option>Saft</option><option>Pflaster</option><option>Inhalator</option><option>Creme / Salbe</option><option value="Andere">Andere</option></select></label><label>Einnahmehäufigkeit<select name="frequency" id="frequency"><option value="daily">Täglich</option><option value="prn">Nach Bedarf (ohne festen Tag)</option><option value="weekly">Wöchentlich (Wochentage wählen)</option><option value="interval">Alle X Tage</option><option value="monthly">Monatlich</option></select></label><div id="weekly-options" class="schedule-options" hidden><span class="field-heading">An welchen Wochentagen?</span><div class="weekdays"><label><input type="checkbox" name="weekday" value="1"> Mo</label><label><input type="checkbox" name="weekday" value="2"> Di</label><label><input type="checkbox" name="weekday" value="3"> Mi</label><label><input type="checkbox" name="weekday" value="4"> Do</label><label><input type="checkbox" name="weekday" value="5"> Fr</label><label><input type="checkbox" name="weekday" value="6"> Sa</label><label><input type="checkbox" name="weekday" value="0"> So</label></div></div><div id="interval-options" class="schedule-options" hidden><label>Abstand in Tagen<input name="intervalDays" type="number" min="2" max="365" value="2" required disabled></label><label>Erste geplante Einnahme<input name="startDate" type="date" required disabled></label></div><div id="monthly-options" class="schedule-options" hidden><label>Tag des Monats<input name="monthDay" type="number" min="1" max="31" value="1" required disabled></label><p class="muted">In Monaten ohne diesen Tag ist keine Einnahme vorgesehen.</p></div><label>Hinweise (optional)<input name="notes" maxlength="250" placeholder="z. B. zum Frühstück"></label><label class="check"><input type="checkbox" name="active" checked>Aktiv</label><div class="actions"><button type="button" class="secondary" id="cancel">Abbrechen</button><button type="submit">Speichern</button></div></form></dialog><dialog id="appointment-editor"><form id="appointment-form"><h2>Termin</h2><input type="hidden" name="id"><label>Bezeichnung<input name="title" required maxlength="120" placeholder="z. B. Blutabnahme"></label><label>Datum<input name="date" type="date" required></label><label>Uhrzeit<input name="time" type="time" required value="09:00"></label><label>Dauer (Minuten)<input name="duration" type="number" min="5" max="1440" value="30" required></label><label>Facharzt (optional)<select name="doctorId" id="appointment-doctor"><option value="">Keine Auswahl</option></select></label><label>Ort / Notiz<input name="notes" maxlength="250"></label><div class="actions"><button type="button" class="secondary" data-close-dialog>Abbrechen</button><button type="submit">Speichern</button></div></form></dialog><dialog id="doctor-editor"><form id="doctor-form"><h2>Facharzt / Praxis</h2><input type="hidden" name="id"><label>Name / Praxis<input name="name" required maxlength="120"></label><label>Fachrichtung<input name="specialty" maxlength="100" placeholder="z. B. Kardiologie"></label><label>Straße und Hausnummer<input name="street" maxlength="150"></label><label>PLZ<input name="zip" maxlength="20"></label><label>Ort<input name="city" maxlength="100"></label><label>Telefon<input name="phone" type="tel" maxlength="50"></label><label>E-Mail<input name="email" type="email" maxlength="150"></label><div class="actions"><button type="button" class="secondary" data-close-dialog>Abbrechen</button><button type="submit">Speichern</button></div></form></dialog><script type="module" src="app.js"></script></body></html>
